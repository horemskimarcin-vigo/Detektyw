materials:
  - id: m25
    type: testimony
    title: Protokół przesłuchania świadka – Halina Gajda
    date: "przesłuchanie"
    source: KPP Zawierzbie
    onRead: { inc: { grounds: 1 } }
    body:
      kind: document
      format: testimony
      header:
        - { label: Świadek, value: "Halina Gajda, l. 71, emerytka, ul. Słoneczna 12" }
      text: |
        Mieszkam przez płot z panią Joanną Kret, od czterech lat. Mam okno kuchni na jej podjazd i garaż.

        W piątek 14 listopada jej białego samochodu **nie było cały wieczór**. Przyjechała **po wpół do jedenastej** – jestem pewna,
        bo właśnie zaczynał się mój serial na Polsacie, który leci o 22:30, i reflektory mi świeciły po ścianie.
        Wjechała prosto do garażu i zamknęła bramę. **W garażu paliło się światło do północy**, potem zgasło.

        W sobotę o siódmej rano myła samochód na podjeździe. W listopadzie! I w środku też odkurzała, długo.
        Wcześniej nigdy tego nie robiła sama, jeździła do myjni.
      signature: "Odczytano, podpisano: H. Gajda"

  - id: m26
    type: field
    title: Notatka z wywiadu środowiskowego – Os. Słoneczne i ul. Lipowiec
    date: "wywiad"
    source: dzielnicowy st. sierż. Karol Malec
    body:
      kind: document
      format: note
      text: |
        **Ul. Lipowiec 5 (Paweł Ostrowski):** sąsiedzi z naprzeciwka twierdzą, że w piątek wieczorem w mieszkaniu było ciemno
        „od dziewiątej”, a samochód Pawła (czarne BMW) zniknął sprzed bloku ok. 20:45 i wrócił „w nocy”. Paweł ma opinię
        osoby zadłużonej; w październiku pod blokiem widziano „dwóch łysych, którzy go szukali”.

        **Ul. Słoneczna 14 (Joanna Kret):** spokojna, uprzejma, mieszka sama. Według sąsiadów od roku „żyje ponad stan” –
        nowy samochód, remont domu, wakacje na Zanzibarze. Sąsiadka przez płot, **pani Halina Gajda (Słoneczna 12)**,
        uchodzi za osobę, która „wie, kto i kiedy przyjeżdża” – zalecam przesłuchanie.

        **Ul. Lipowa (okolice hotelu):** bezdomny **Zenon Mazur** bywa widywany w ogrodzie hotelu; właściciel tolerował jego nocowanie w altanie.
      signature: "st. sierż. Karol Malec"

  - id: m27
    type: testimony
    title: Protokół przesłuchania świadka – Krzysztof Bąk (uzupełniający)
    date: "przesłuchanie"
    source: KPP Zawierzbie
    body:
      kind: document
      format: testimony
      header:
        - { label: Świadek, value: "Krzysztof Bąk, l. 46, właściciel firmy BĄK-REMONTY" }
      text: |
        Prostuję wcześniejsze wyjaśnienia. W piątek 14.11 **byłem w hotelu ok. 21:30**. Przyjechałem po swoje narzędzia
        (młotowiertarka, poziomica laserowa), bo Ostrowski zapowiedział, że w poniedziałek zmienia zamki i „nic nie odbiorę”.
        Wszedłem bramą boczną od strony remontu, na swój klucz. Wyszedłem po kilkunastu minutach.

        Idąc z narzędziami wzdłuż ogrodu, przechodziłem pod oknem gabinetu. Okno było uchylone, paliło się światło.
        Słyszałem rozmowę: **Ostrowski i kobieta**. Ona mówiła cicho, nerwowo. Słowa „Wiktor, proszę cię” słyszałem wyraźnie.
        On odpowiedział twardo, coś w rodzaju „nie ma mowy, w poniedziałek”. Nie zaglądałem. Odjechałem przed 21:45.
        Głosu kobiety nie rozpoznałem z pewnością. Nikogo nie skrzywdziłem.
      signature: "Odczytano, podpisano: K. Bąk"

  - id: m43
    type: testimony
    title: Protokół przesłuchania świadka – Zenon Mazur
    date: "przesłuchanie"
    source: KPP Zawierzbie
    onRead: { inc: { grounds: 1 } }
    body:
      kind: document
      format: testimony
      header:
        - { label: Świadek, value: "Zenon Mazur, l. 58, bez stałego miejsca zamieszkania" }
        - { label: Uwagi, value: "Świadek trzeźwy w chwili przesłuchania (badanie alkomatem 0,0‰)." }
      text: |
        Z piątku na sobotę spałem w altanie w ogrodzie hotelu, za kuchnią. Szef pozwalał, jak było zimno.

        Koło wpół do dziesiątej był bus tego budowlańca – krótko, pokręcił się z narzędziami i pojechał.
        Potem, **koło dziesiątej**, może chwilę wcześniej, z tylnych drzwi wyszła kobieta. **Jasny płaszcz**, szła szybko,
        niosła coś zawiniętego w **biały ręcznik**, trzymała to jak niemowlę, przy sobie. Wsiadła do **małego białego auta**
        na tylnym parkingu i odjechała **bez świateł** – włączyła je dopiero na ulicy. Twarzy nie widziałem, było ciemno.
        Wzrost średni, włosy chyba spięte.
      signature: "Odczytano, podpisano: Z. Mazur"

