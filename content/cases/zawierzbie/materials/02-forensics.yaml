    type: photo
    title: "Fotografia z przeszukania: zawiniątko w garażu"
    date: "przeszukanie"
    source: Technik kryminalistyki
    body:
      kind: photo
      image: a05.jpg
      caption: Regał w garażu, obok koła zapasowego. Zawiniątko rozłożone przez technika.
      width: 1408
      height: 768
      hotspots:
        - id: h_statue_base
          x: 0.636
          y: 0.586
          r: 0.06
          minZoom: 2
          label: Ośmiokątna podstawa z ciemnymi zaciekami
          description: Krawędź mosiężnej podstawy jest lekko wgnieciona, a w zagłębieniu widać zaschnięte, ciemnobrunatne zacieki.
          effects: { set: [statue_stains] }
        - id: h_towel
          x: 0.593
          y: 0.762
          r: 0.06
          label: Haft „Pod Lipami” na ręczniku
          description: Ręcznik pochodzi z hotelowej pralni – taki sam haft jak na ręcznikach w pokojach.

  - id: m39
    type: lab
    title: Ekspertyza statuetki „Złota Lipa” – DNA i daktyloskopia
    date: "laboratorium"
    source: Laboratorium Kryminalistyczne KWP
    body:
      kind: document
      format: lab
      text: |
        **Badania genetyczne:** zacieki z krawędzi podstawy – krew ludzka; profil DNA **zgodny z profilem Wiktora Ostrowskiego**
        (prawdopodobieństwo przypadkowej zgodności < 1 : 10⁹).

        **Daktyloskopia:** na korpusie statuetki ujawniono 2 ślady linii papilarnych przydatne do identyfikacji.
        Ślad nr 1 – **zgodny z odbitką palca wskazującego prawej ręki Joanny Kret** (odbitki porównawcze z akt osobowych).
        Ślad nr 2 – zgodny z odbitkami Wiktora Ostrowskiego.

        **Lakier i stop:** mosiądz z lakierem nitrocelulozowym, skład zgodny z cząstkami z rany (pakiet A-3).
        Kształt krawędzi podstawy (ośmiokąt, bok 5,6 cm) odpowiada opisowi wgłobienia w protokole sekcji.
      signature: "Laboratorium Kryminalistyczne KWP"

  - id: m40
    type: report
    title: Protokół przeszukania – wynik negatywny
    date: "przeszukanie"
    source: KPP Zawierzbie
    body:
      kind: document
      format: report
      text: |
        Przeszukano dom, garaż i samochód Skoda Fabia nr rej. TZA 47816. **Nie ujawniono przedmiotów związanych ze sprawą.**

        - Garaż świeżo uporządkowany, podłoga umyta; na regale przy kole zapasowym czysty ślad po zdjętym przedmiocie.
        - Samochód: wnętrze świeżo umyte.
        - Pusta przegródka w szafie podpisana „B-R”.

        Osoba przeszukiwana: „Po tym, co piszą gazety, spodziewałam się was. Proszę szukać, nie mam nic do ukrycia.”
        Sąsiedzi zeznali, że po publikacji w prasie właścicielka wyjeżdżała wieczorem w stronę Wisły.
      signature: "asp. sztab. Robert Nowicki"
