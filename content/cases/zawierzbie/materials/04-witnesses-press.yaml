  - id: m28
    type: press
    title: "„Echo Powiatu”: Syn hazardzista i miliony w tle?"
    date: "16.11.2025"
    source: echopowiatu.pl
    redHerring: true
    unlockWhen: { time: { gte: 2 } }
    body:
      kind: press
      outlet: Echo Powiatu
      headline: Syn zamordowanego hotelarza tonął w długach
      lead: Paweł O. – nieoficjalnie – był winien „poważnym ludziom” dziesiątki tysięcy złotych. W dniu śmierci ojca mieli się pokłócić.
      text: |
        Według naszych informatorów młody Ostrowski od miesięcy obstawiał zakłady i grał w karty. „Ojciec nie chciał płacić jego długów”
        – mówi osoba z otoczenia rodziny. Świadkowie słyszeli w piątek po południu głośną kłótnię w holu hotelu.

        Czy to przypadek, że syn odziedziczy część majątku wartego kilka milionów? Pytania mnożą się także wokół **żony** zmarłego,
        z którą był w separacji, oraz **inwestora**, który od miesięcy chciał przejąć hotel.

        Prokuratura odmawia komentarza. „Echo” będzie informować na bieżąco.
      byline: Sylwia Krajewska

  - id: m29
    type: press
    title: "„Kurier Zawierzbiański”: Inwestor chciał hotelu za wszelką cenę"
    date: "18.11.2025"
    source: kurierzawierzbie.pl
    redHerring: true
    unlockWhen: { time: { gte: 6 } }
    body:
      kind: press
      outlet: Kurier Zawierzbiański
      headline: Lisiecki, hotel i „propozycja nie do odrzucenia”
      lead: Znany stomatolog i inwestor od dwóch lat próbował kupić „Pod Lipami”. Ostrowski odmawiał. Teraz decyzję podejmą spadkobiercy.
      text: |
        Dr Tomasz Lisiecki, właściciel sieci klinik i inwestor w branży nieruchomości, potwierdza, że jego oferta – **4,2 mln zł** – „jest aktualna”.
        Nieoficjalnie: na gali charytatywnej w piątek wieczorem dr Lisiecki „na jakiś czas zniknął”, choć sam twierdzi, że był tam cały wieczór.

        W sprawie wykonawcy remontu, Krzysztofa B., „Kurier” ustalił, że policja przesłuchiwała go już dwukrotnie.
        Mieszkańcy pytają: dlaczego jeszcze nikt nie został zatrzymany?
      byline: Oprac. (red)
