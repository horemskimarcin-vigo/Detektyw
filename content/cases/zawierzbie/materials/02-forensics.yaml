  - id: m37
    type: report
    title: Protokół przeszukania – dom i garaż przy ul. Słonecznej 14
    date: "przeszukanie"
    source: KPP Zawierzbie
    body:
      kind: document
      format: report
      header:
        - { label: Podstawa, value: "Postanowienie Prokuratury Rejonowej w Zawierzbiu" }
        - { label: Obecna, value: "Joanna Kret (właścicielka)" }
      text: |
        Przeszukano dom, garaż i samochód Skoda Fabia nr rej. TZA 47816.

        - **Garaż, regał przy kole zapasowym:** zawiniątko z białego ręcznika frotte z haftem „Pod Lipami”. Wewnątrz mosiężna statuetka
          w kształcie drzewa lipy na **ośmiokątnej podstawie**, wys. ok. 30 cm, masa ok. 2,9 kg. Na podstawie tabliczka:
          „Złota Lipa 2019 – Hotel Roku Ziemi Zawierzbiańskiej”. Na krawędzi podstawy ciemnobrunatne zacieki.
        - Samochód: wnętrze świeżo umyte, zapach środka czyszczącego, dywaniki wyprane.
        - Gabinet domowy: segregator z dokumentami firmy „Bud-Rem Serwis” – brak; pusta przegródka w szafie podpisana „B-R”.
        - Kosz w kuchni: pusta koperta bankowa z nadrukiem „Hotel Pod Lipami – utarg”.

        Osoba przeszukiwana oświadczyła, że statuetkę „ktoś musiał podrzucić” i że ręczniki z hotelu „ma każdy pracownik”.
        Zabezpieczone przedmioty przekazano do badań.
      signature: "asp. sztab. Robert Nowicki"

