title: "Ostatni gość hotelu Pod Lipami"
teaser: >-
  Zawierzbie, listopad. W gabinecie właściciela najstarszego hotelu w mieście sprzątaczka znajduje ciało.
  Rozbite okno, pusta kasetka, a w mieście – sześć osób, które miały powód, by Wiktor Ostrowski zniknął.
