    title: Wyciąg z rachunku hotelu – przelewy na rzecz Bud-Rem Serwis
    date: "01.2025–10.2025"
    source: Bank Spółdzielczy w Zawierzbiu
    body:
      kind: table
      columns: [Data, Odbiorca, Tytuł, Kwota, Zlecający (bankowość elektr.)]
      rows:
        - ["21.01.2025", "Bud-Rem Serwis Sp. z o.o.", "FV 01/2025 konserwacja instalacji", "11 800,00 zł", "jkret"]
        - ["18.02.2025", "Bud-Rem Serwis Sp. z o.o.", "FV 04/2025 przegląd kotłowni", "9 450,00 zł", "jkret"]
        - ["20.03.2025", "Bud-Rem Serwis Sp. z o.o.", "FV 07/2025 naprawy pokoje 101-112", "14 900,00 zł", "jkret"]
        - ["…", "…", "(8 kolejnych przelewów)", "…", "jkret"]
        - ["13.10.2025", "Bud-Rem Serwis Sp. z o.o.", "FV 31/2025 serwis klimatyzacji", "16 300,00 zł", "jkret"]
        - ["29.10.2025", "Bud-Rem Serwis Sp. z o.o.", "FV 33/2025 prace dodatkowe", "21 700,00 zł", "jkret"]
        - ["", "", "**RAZEM (14 przelewów)**", "**186 450,00 zł**", ""]
      note: |
        Wszystkie przelewy zlecono z konta użytkownika **„jkret”** w bankowości internetowej hotelu. Właściciel zatwierdzał zbiorcze paczki przelewów raz w miesiącu.
        Rachunek odbiorcy prowadzony w innym banku; z informacji banku: środki wypłacane gotówką w ciągu kilku dni od wpływu.

  - id: m23
    type: other
    title: Zestawienie od księgowej – faktury Bud-Rem Serwis
    date: "16.11.2025"
    source: Biuro Rachunkowe Ewa Dziedzic
    onRead: { set: [fraud_known] }
    body:
      kind: document
      format: report
      text: |
        Na prośbę organów ścigania przekazuję zestawienie, o które w czwartek pytał pan Ostrowski.

        | Dostawca | Liczba faktur 2025 | Kwota brutto | Protokoły odbioru prac |
        |---|---|---|---|
        | BĄK-REMONTY (remont skrzydła) | 6 | 312 000 zł | są, podpisane przez p. Ostrowskiego |
        | Gastro-Pol (zaopatrzenie) | 41 | 268 300 zł | dokumenty WZ |
        | **Bud-Rem Serwis Sp. z o.o.** | **14** | **186 450 zł** | **brak – żadnego** |

        Faktury Bud-Rem były opisywane i wprowadzane do systemu przez kierownika hotelu, zgodnie z procedurą obowiązującą od 2020 r.
        Właściciel zatwierdzał zbiorcze zestawienia.

        **Informacja z KRS** (pobrana 13.11.2025 na prośbę p. Ostrowskiego): Bud-Rem Serwis Sp. z o.o., wpisana 9.12.2024,
        siedziba: "Kielce (adres wirtualnego biura), prezes zarządu i jedyny wspólnik: **Dariusz Kret**."

        W czwartek o 17:40 pan Ostrowski zadzwonił do mnie jeszcze raz. Powiedział, że „wszystko jasne” i że w poniedziałek
        idzie do prokuratury, ale najpierw „da tej osobie szansę się wytłumaczyć – po ludzku, twarzą w twarz”.
      signature: "Ewa Dziedzic, biegła rewident"

  - id: m41
    type: other
    title: Plik z laptopa ofiary – „zawiadomienie_projekt.docx”
    date: "utworzono 13.11.2025, 22:41"
    source: Biegły informatyk – analiza laptopa
    onRead: { inc: { grounds: 1 } }
    body:
      kind: document
      format: letter
      text: |
        Zawierzbie, dnia 17 listopada 2025 r.

        **Prokuratura Rejonowa w Zawierzbiu**

        **ZAWIADOMIENIE O PODEJRZENIU POPEŁNIENIA PRZESTĘPSTWA**

        Jako właściciel Hotelu „Pod Lipami” zawiadamiam o podejrzeniu popełnienia przestępstwa z art. 284 § 2 k.k. (przywłaszczenie
        powierzonego mienia) oraz art. 296 k.k. na szkodę hotelu. W okresie od stycznia do października 2025 r. na rachunek
        spółki Bud-Rem Serwis wypłacono **186 450 zł** za usługi, których nikt w hotelu nie widział.
        Faktury wprowadzała i opisywała **kierowniczka hotelu**, Pani J.K., a jedynym wspólnikiem spółki jest osoba o tym samym nazwisku.

        [Tu dopisać: rozmowa w piątek – czy odda pieniądze? Jeżeli tak, może wniosek o łagodny wymiar…]

        W załączeniu: zestawienie faktur, wydruk z KRS, wyciągi (teczka B-R).
      signature: "Wiktor Ostrowski (niepodpisane)"

  - id: m35
    type: other
    title: Polisa na życie – Wiktor Ostrowski
    date: "polisa z 2011 r."
    source: Towarzystwo ubezpieczeniowe
    redHerring: true
    body:
      kind: document
      format: report
      text: |
        Ubezpieczony: "Wiktor Ostrowski. Suma ubezpieczenia: **400 000 zł**."
        Uposażony: **Marta Ostrowska** (żona) – 100%. Ostatnia zmiana uposażonego: brak (od 2011 r.).

        Adnotacja agenta z 03.10.2025: „Klient pytał o procedurę zmiany uposażonego w związku z rozwodem. Nie złożył wniosku.”

  - id: m36
    type: other
    title: Pismo pełnomocnika Marty Ostrowskiej – projekt ugody rozwodowej
    date: "07.11.2025"
    source: Kancelaria adw. Lucyny Bednarek, Radom
    redHerring: true
    body:
      kind: document
      format: letter
      text: |
        W imieniu mojej Mocodawczyni przedstawiam projekt ugody: podział majątku wspólnego przez przyznanie Panu Wiktorowi Ostrowskiemu
        hotelu wraz z nieruchomością, ze spłatą na rzecz Pani Marty Ostrowskiej w kwocie **1 200 000 zł** w czterech ratach.

        Wyznaczam termin na odpowiedź do **30 listopada 2025 r.** Brak odpowiedzi skutkować będzie wnioskiem o podział majątku
        w postępowaniu sądowym, w tym o ustanowienie zarządcy przymusowego.

  - id: m30
    type: messages
    title: Wiadomości z telefonu Pawła Ostrowskiego – kontakt „Gruby”
    date: "11–14.11.2025"
    source: Telefon Pawła Ostrowskiego
    body:
      kind: messages
      participants: [Paweł, Gruby]
      messages:
        - { from: Gruby, t: "11.11 22:10", text: "Piątek. 60 koła. Nie jestem bankiem." }
        - { from: Paweł, t: "11.11 22:14", text: "Będzie. Stary mi da." }
        - { from: Gruby, t: "14.11 17:30", text: "I co, dał?" }
        - { from: Paweł, t: "14.11 17:52", text: "Nie. Daj mi tydzień." }
        - { from: Gruby, t: "14.11 18:05", text: "Masz do poniedziałku. Potem przyjadę do hotelu." }
        - { from: Paweł, t: "14.11 20:40", text: "Dziś gram u Mariana. Odbiję się, zobaczysz." }
        - { from: Gruby, t: "15.11 11:02", text: "Słyszałem o starym. Przykro mi. Termin aktualny." }

  - id: m31
    type: testimony
    title: Protokół przesłuchania świadka – Marian Kołek
    date: "przesłuchanie"
    source: KPP Zawierzbie
    body:
      kind: document
      format: testimony
      header:
        - { label: Świadek, value: "Marian Kołek, l. 60, emeryt kolejarz" }
      text: |
        W piątek 14 listopada u mnie w garażu na Kolejowej 7 grało pięciu panów w karty, w tym Paweł Ostrowski.
        Przyjechał przed dziewiątą wieczorem, wyjechał po drugiej w nocy. **Ani razu nie wychodził na dłużej**, najwyżej na papierosa przed garaż.
        Przegrał koło czterech tysięcy. Nazwiska pozostałych podam – potwierdzą.
      signature: "Odczytano, podpisano: M. Kołek"

