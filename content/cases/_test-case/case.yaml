  title: 'Kradzież w Galerii Pod Zegarem'
  text: |
    W nocy z niedzieli na poniedziałek z zamkniętej gabloty Galerii Pod Zegarem zniknął zabytkowy klucz do ratuszowej wieży.
    Gablota nie nosi śladów włamania. Właścicielka galerii, Irena Wolska, zgłosiła kradzież rano.
    Masz cztery dni, żeby wskazać sprawcę.
deadlineText: 'Prokurator żąda decyzji: oskarż kogoś albo zamknij sprawę.'
