# Lokalnie: `docker compose up --build` → http://localhost:3000 (Mailpit: `--profile dev`, http://localhost:8025)
# Na VPS z HTTPS: ustaw DOMAIN i APP_URL w .env, potem `docker compose --profile https up -d --build`.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://detektyw:${POSTGRES_PASSWORD:-detektyw}@db:5432/detektyw
      APP_URL: ${APP_URL:-http://localhost:3000}
      SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
      MAIL_FROM: ${MAIL_FROM:-Detektyw <no-reply@localhost>}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      ASSISTANT_LLM: ${ASSISTANT_LLM:-off}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: detektyw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-detektyw}
      POSTGRES_DB: detektyw
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U detektyw']
      interval: 5s
      retries: 10
  caddy:
    image: caddy:2.10
    profiles: ['https']
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app
  mailpit:
    image: axllent/mailpit:v1.27
    profiles: ['dev']
    ports:
      - '8025:8025'
volumes:
  pgdata:
  caddy_data:
