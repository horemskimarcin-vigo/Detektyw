  - id: m20
    type: report
    title: Opinia biegłego informatyka – dziennik routera Wi-Fi hotelu
    date: "zabezpieczono logi"
    source: biegły sądowy z zakresu informatyki, inż. Michał Stróż
    onRead: { inc: { grounds: 1 } }
    body:
      kind: document
      format: report
      text: |
        Zabezpieczono dziennik routera TP-Link w zapleczu recepcji (pojemność bufora – ok. 5 dób, wpisy starsze są nadpisywane).

        Połączenia z siecią „PodLipami-Staff” w dniu **14.11.2025** po godz. 18:00:

        | Urządzenie (nazwa sieciowa) | Adres MAC | Połączenie | Rozłączenie |
        |---|---|---|---|
        | WiktorO-Laptop | 3C:52:..:A1 | 06:58 | – (aktywne) |
        | Galaxy-S23-Wiktor | 9A:11:..:4F | 07:02 | 21:58 (*) |
        | Galaxy-A54-Joanna | F2:08:..:C7 | **21:23** | **22:02** |
        | iPhone-Agnieszka | 6E:B3:..:20 | 13:55 | 20:05 |

        (*) Telefon ofiary rozładował się – ostatni sygnał o 21:58.

        Urządzenie „Galaxy-A54-Joanna” było przypisane wcześniej do tego samego adresu MAC w dniach roboczych (godz. 8–18).
        Zasięg routera nie wychodzi poza budynek i ogród.
      signature: "inż. Michał Stróż"

