  - id: m12
    type: autopsy
    title: Protokół sekcji zwłok – Wiktor Ostrowski
    date: "16.11.2025"
    source: Zakład Medycyny Sądowej, dr hab. Irena Sokół
    unlockWhen: { time: { gte: 2 } }
    body:
      kind: document
      format: autopsy
      header:
        - { label: Nr sekcji, value: "ZMS-1187/25" }
        - { label: Zlecający, value: "Prokuratura Rejonowa w Zawierzbiu, RSD-418/25" }
        - { label: Data, value: "16.11.2025" }
      text: |
        # Badanie zewnętrzne
        Zwłoki mężczyzny, wzrost 178 cm, masa ok. 86 kg. W okolicy potylicznej prawej **rana tłuczona o kształcie łukowato-łamanym**,
        dł. 7 cm, z otarciem naskórka po stronie przyśrodkowej. Brak obrażeń o charakterze obronnym na dłoniach i przedramionach.
        Brak innych obrażeń.

        # Badanie wewnętrzne
        Złamanie wieloodłamowe kości potylicznej prawej z wgłobieniem odłamów. Krwiak podtwardówkowy, stłuczenie płatów potylicznych.
        Kształt wgłobienia odpowiada **krawędzi przedmiotu twardego, ciężkiego, o podstawie wielokątnej** – fragment obrysu
        wskazuje na figurę o kątach ok. 135°, odcinki ok. 5–6 cm (np. **ośmiokąt**).
        W ranie stwierdzono **drobne cząstki o złotawym połysku**, zabezpieczone do badań (pakiet A-3).

        # Ustalenia
        1. Przyczyna zgonu: **uraz czaszkowo-mózgowy** spowodowany pojedynczym, silnym uderzeniem w tył głowy.
        2. Ułożenie rany wskazuje, że pokrzywdzony **stał tyłem lub bokiem do sprawcy** i nie spodziewał się ciosu.
        3. Treść żołądka: częściowo strawiony posiłek (zupa, mięso, ziemniaki). Przy kolacji ok. 19:00 – **zgon między 21:00 a 23:00**.
        4. Alkohol we krwi – oznaczenie w toku (pakiet T-1).
        5. Nie stwierdzono śladów przemieszczania zwłok po zgonie.
      signature: "dr hab. n. med. Irena Sokół"

  - id: m13
    type: lab
    title: "Ekspertyza mikrośladów z rany (pakiet A-3)"
    date: "pracownia fizykochemii"
    source: Laboratorium Kryminalistyczne KWP
    body:
      kind: document
      format: lab
      header:
        - { label: Materiał, value: "Cząstki z rany okolicy potylicznej, pakiet A-3" }
        - { label: Metoda, value: "SEM-EDS, FTIR" }
      text: |
        **Wyniki:**
        - Cząstki metaliczne: **mosiądz** (Cu ok. 63%, Zn ok. 37%), tzw. mosiądz odlewniczy.
        - Na części cząstek **powłoka lakieru nitrocelulozowego z pigmentem złotym** – typowa dla przedmiotów dekoracyjnych
          (statuetki, trofea, okucia ozdobne), niespotykana w narzędziach warsztatowych.
        - Nie stwierdzono śladów rdzy, smarów ani stali narzędziowej.

        **Wniosek:** narzędziem był najprawdopodobniej masywny przedmiot dekoracyjny z lakierowanego mosiądzu.
      signature: "biegły: mgr inż. Krystian Mazurek"

  - id: m14
    type: lab
    title: Opinia techniczna – szyba okna gabinetu
    date: "laboratorium"
    source: Laboratorium Kryminalistyczne KWP
    body:
      kind: document
      format: lab
      text: |
        Zbadano rozkład odłamków szyby (zebranych z trawnika i z wnętrza pomieszczenia) oraz charakter pęknięć na krawędziach.

        - Na zewnątrz zebrano ok. **92%** masy odłamków, wewnątrz ok. 8%.
        - Linie łuków (tzw. linie Wallnera) na krawędziach odłamków wskazują, że **siła działała od strony wnętrza pomieszczenia**.
        - Na krawędziach otworu brak włókien tekstylnych, krwi i śladów przeciskania się.
        - Klamka okna w pozycji zamkniętej, na niej odciski palców wyłącznie ofiary.

        **Wniosek:** szybę wybito od wewnątrz. Nikt nie wszedł przez okno.
      signature: "biegły: dr inż. Anna Wiśniewska"

  - id: m42
    type: lab
    title: Wynik badania toksykologicznego (pakiet T-1)
    date: "laboratorium"
    source: Zakład Medycyny Sądowej
    redHerring: true
    body:
      kind: document
      format: lab
      text: |
        - Alkohol etylowy we krwi: **0,4‰** (odpowiada ok. jednemu kieliszkowi wina lub piwu).
        - Leki: metoprolol (lek nasercowy) w stężeniu terapeutycznym.
        - Substancje odurzające, leki nasenne: **nie wykryto**.

        Wynik nie wskazuje, by pokrzywdzony był w chwili zdarzenia odurzony lub nieprzytomny.
      signature: "Pracownia Toksykologii ZMS"

  - id: m15
    type: cctv
    title: Monitoring – kamera nad wejściem głównym hotelu
    date: "14.11.2025, 18:00–24:00"
    source: Rejestrator w recepcji hotelu
    summary: Kamera obejmuje wyłącznie przedni parking i wejście główne. Tył budynku poza zasięgiem.
    body:
      kind: cctv
      camera: "CAM-1"
      location: "Hotel „Pod Lipami” – parking przedni"
      frames:
        - t: "18:31:05"
          image: c01.jpg
          caption: Z parkingu wyjeżdża biały samochód osobowy.
          hotspots:
            - id: h_cam_fabia
              x: 0.76
              y: 0.51
              r: 0.06
              minZoom: 2
              label: Biała Skoda Fabia, tablica TZA 47…
              description: Samochód kierowniczki hotelu wyjeżdża z przedniego parkingu o 18:31 – zgodnie z jej zeznaniem.
              effects: { set: [fabia_known] }
        - t: "20:05:40"
          image: c02.jpg
          caption: Kobieta w kurtce wychodzi wejściem głównym i odchodzi pieszo w stronę ulicy.
        - t: "21:28:12"
          image: c03.jpg
          caption: Na parkingu stoi biały bus dostawczy. Kierowca w kurtce roboczej idzie w stronę bramy bocznej.
          hotspots:
            - id: h_cam_van
              x: 0.585
              y: 0.38
              r: 0.1
              label: Bus z napisem „BĄK-REMONTY”
              description: Na boku busa logo firmy wykonawcy remontu. Kierowca – mężczyzna w kurtce roboczej.
              effects: { set: [van_seen] }
        - t: "21:41:30"
          image: c04.jpg
          caption: Bus z zapalonymi światłami rusza z parkingu. Po lewej stronie kadru widać zapalone światło w oknie na parterze.
        - t: "23:58:00"
          image: c05.jpg
          caption: Parking pusty. Światło w oknie na parterze nadal się pali.
      log:
        - { t: "18:31", text: "Ruch: pojazd osobowy wyjeżdża" }
        - { t: "20:05", text: "Ruch: osoba piesza – wejście główne" }
        - { t: "21:28", text: "Ruch: pojazd dostawczy wjeżdża" }
        - { t: "21:41", text: "Ruch: pojazd dostawczy wyjeżdża" }
        - { t: "23:58", text: "Brak ruchu (zapis kontrolny)" }

